version: "3.9"
services:
  app:
    build:
      context: .
      target: laravel
      args:
        APP_ENV: production  # Change to 'development' for dev
    ports:
      - "8000:8000"
    depends_on:
      - vite
    volumes:
      - .:/app
    environment:
      - APP_ENV=production

  vite:
    build:
      context: .
      target: vite
      args:
        APP_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    command: npm run dev -- --host 0.0.0.0
